project: patho_benchmark
experiment: uni2_randlora_unetr
experiment_path: experiments
training_steps: 20000
log_interval: 10
val_interval: 200
multiprocessing: true
num_workers: 2
seed: 42
primary_metric: f1_score_macro
save_all_ckpts: false
early_stopping: 5000

dataset:
  name: phenecell
  batch_size: 8
  uniform_class_sampling: true
  sample_excluded_classes: false
  path: /Path/to/PathoCell/data/phenocell/phenocell_lmdb
  split: /Path/to/PathoCell/data/phenocell/splits/phenocell_dataset_split.csv
  label_dict: /Path/to/PathoCell/data/phenocell/label_dict.json

model:
  model_wrapper: UnetR
  backbone: uni2
  unfreeze_backbone: false
  do_ms_aug: false
  randlora_enable: true
  randlora_rank: 4
  randlora_num_basis: 16
  randlora_seed: 42
  randlora_param_type: randlora
  randlora_sparse: false
  randlora_dist_type: uniform
  randlora_sparcity: 6
  randlora_attn_only: false
  randlora_mlp_only: false

optimizer:
  name: AdamW
  params:
    lr: 3.0e-05
    weight_decay: 0.05
  warmup_steps: 1000

scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 20000
    eta_min: 1.0e-06

loss_fn:
  name: CrossEntropyLoss
  params:
    label_smoothing: 0.05
    reduction: none
  class_weighting: true
  exclude_classes: [0]

augmentations:
  RandomHorizontalFlip:
    p: 0.5
  RandomVerticalFlip:
    p: 0.5
  RandomAffine:
    degrees: [0, 360]
    translate: 0.1
    scale: [0.8, 1.2]
    resample: BILINEAR
  RandomElasticTransform:
    kernel_size: [63, 63]
    sigma: [32.0, 32.0]
    alpha: [1.0, 1.0]
  HEDNormalize:
    sigma: 0.025
    bias: 0.05

save_snapshots: false
