project: patho_benchmark
experiment: hovernext_phenecell_reproduction
experiment_path: experiments
training_steps: 20000
log_interval: 10
val_interval: 200
multiprocessing: false
num_workers: 4
seed: 42
primary_metric: f1_score_macro
save_all_ckpts: false
early_stopping: 1500

dataset:
  name: phenecell
  path: /Path/to/PathoCell/data/phenocell/phenocell_lmdb
  split: /Path/to/PathoCell/data/phenocell/splits/phenocell_dataset_split.csv
  label_dict: /Path/to/PathoCell/data/phenocell/label_dict.json
  batch_size: 32
  uniform_class_sampling: true
  sample_excluded_classes: false

model:
  model_wrapper: HoverNext
  backbone: convnextv2_large.fcmae_ft_in22k_in1k
  unfreeze_backbone: true
  devices: [0, 1]
  do_ms_aug: false

optimizer:
  name: AdamW
  params:
    lr: 3e-5
    weight_decay: 0.03
  warmup_steps: 100

scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 20000
    eta_min: 1e-6

loss_fn:
  name: FocalLoss
  params:
    reduction: mean
    alpha: 1.0
    gamma: 2.0
  class_weighting: true

augmentations:
  RandomHorizontalFlip:
    p: 0.5
  RandomVerticalFlip:
    p: 0.5
  RandomAffine:
    degrees: [0, 360]
    translate: 0.1
    scale: [0.8, 1.2]
    resample: BILINEAR
  RandomElasticTransform:
    kernel_size: [63, 63]
    sigma: [32.0, 32.0]
    alpha: [1.0, 1.0]
  HEDNormalize:
    sigma: 0.025
    bias: 0.05

save_snapshots: false
