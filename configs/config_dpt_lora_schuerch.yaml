# DPT head + LoRA on backbone (Hu et al. 2021: Q and V only). Omit lora_r for decoder-only DPT.
project: patho_benchmark
experiment: dpt_lora
experiment_path: experiments
training_steps: 20000
log_interval: 10
val_interval: 200
multiprocessing: true
num_workers: 2
seed: 42
primary_metric: f1_score_macro
save_all_ckpts: false
early_stopping: 5000
# Optimizer steps = training_steps; each step uses this many micro-batches (effective batch ≈ batch_size × this).
gradient_accumulation_steps: 1

dataset:
  name: phenecell
  batch_size: 4
  uniform_class_sampling: true
  sample_excluded_classes: false
  path: /Path/to/PathoCell/data/phenocell/phenocell_lmdb
  split: /Path/to/PathoCell/data/phenocell/splits/phenocell_dataset_split.csv
  label_dict: /Path/to/PathoCell/data/phenocell/label_dict.json

model:
  model_wrapper: DPT
  backbone: uni2  # provgigapath, uni, uni2, musk, titan, virchow2, phikonv2
  unfreeze_backbone: false  # keep false for LoRA
  do_ms_aug: false
  lora_r: 16       # Hu et al. 2021; target_modules = Q and V only
  lora_alpha: 32  # scale = alpha/r = 2.0
  lora_dropout: 0.1
  # lora_adapter_layers: 4  # optional: only last N ViT blocks get LoRA; omit to train all blocks

optimizer:
  name: AdamW
  params:
    lr: 3e-5
    weight_decay: 0.05
  warmup_steps: 1000

scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 20000
    eta_min: 1e-6

loss_fn:
  name: CrossEntropyLoss
  params:
    label_smoothing: 0.05
    reduction: none
  class_weighting: true
  exclude_classes: [0]

augmentations:
  RandomHorizontalFlip:
    p: 0.5
  RandomVerticalFlip:
    p: 0.5
  RandomAffine:
    degrees: [0, 360]
    translate: 0.1
    scale: [0.8, 1.2]
    resample: BILINEAR
  RandomElasticTransform:
    kernel_size: [63, 63]
    sigma: [32.0, 32.0]
    alpha: [1.0, 1.0]
  HEDNormalize:
    sigma: 0.025
    bias: 0.05
